[package]
name = "kernel-generic-stm32h753"
version = "0.1.0"
edition = "2021"

[features]
clock-64mhz-hsi16 = []

[dependencies]
# see /home/mxhdrm/projects/openprot/hubris/app/demo-stm32h7-nucleo:13
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
stm32-metapac = { version = "16.0.0", features = ["stm32h753zi"] }
stm32h7 = { version = "0.16.0", features = ["stm32h753", "rt"] }

[dependencies.hubris-kern]
package = "kern"
git = "https://github.com/cbiffle/hubris-fork.git"
branch = "cbiffle/exhubris-fixes"
features = ["nano", "stack-watermark"]

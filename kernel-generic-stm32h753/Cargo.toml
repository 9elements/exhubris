[package]
name = "kernel-generic-stm32h753"
version = "0.1.0"
edition = "2021"

[features]

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
stm32-metapac = {version = "16.0.0", features = ["rt", "stm32h753zi"]}
# drv-stm32h7-startup = { git = "https://github.com/cbiffle/hubris-fork.git", package = "drv-stm32h7-startup"}

[dependencies.hubris-kern]
package = "kern"
git = "https://github.com/cbiffle/hubris-fork.git"
branch = "cbiffle/exhubris-fixes"
features = ["nano", "stack-watermark"]
